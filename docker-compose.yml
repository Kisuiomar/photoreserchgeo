services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAPILLARY_ACCESS_TOKEN=${MAPILLARY_ACCESS_TOKEN:-${MAPILLARY_TOKEN}}
      - MAPILLARY_TOKEN=${MAPILLARY_TOKEN}
    env_file: .env
    volumes:
      - ./backend:/app
      - model-cache:/root/.cache
      - ${PHOTO_LIBRARY_PATH:-./photos}:/photos
      - ./data:/data
    networks:
      - app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Healthcheck probes /api/health which only responds once uvicorn is
    # serving, which in turn only happens after the model has been
    # downloaded + loaded on startup (see model.load).
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; urllib.request.urlopen(''http://localhost:8000/api/health'',timeout=3)" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 120 # ~20 min, comfortable for a ~3.5 GB first-run download
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8085"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Frontend only starts after backend is fully ready so users can't
    # reach the UI while the model is still downloading.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  model-cache:
