services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - model-cache:/root/.cache
      - ${PHOTO_LIBRARY_PATH:-./photos}:/photos
      - ./data:/data
    networks:
      - app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8085"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  model-cache:
